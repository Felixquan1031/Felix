<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的相册 - 协作版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>📸 我们的相册</h1>
            <p>记录美好时光，留下珍贵回忆</p>
        </div>
    </header>

    <main class="container">
        <!-- 上传区域 -->
        <section class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <p>点击或拖拽上传新照片</p>
                <span class="upload-hint">支持 JPG、PNG、GIF，单张不超过 2MB</span>
                <input type="file" id="fileInput" accept="image/*" multiple hidden>
            </div>
            <div class="upload-progress" id="uploadProgress" style="display:none;">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <span id="progressText">上传中...</span>
            </div>
        </section>

        <div class="toolbar">
            <div class="stats">
                共 <span id="photoCount">0</span> 张照片
            </div>
            <button class="refresh-btn" id="refreshBtn" title="刷新">🔄 刷新</button>
        </div>

        <div id="gallery" class="gallery">
            <!-- 照片由 JS 生成 -->
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>
    </main>

    <!-- 灯箱 -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" title="关闭">&times;</button>
        <button class="lightbox-nav prev" title="上一张">‹</button>
        <button class="lightbox-nav next" title="下一张">›</button>

        <div class="lightbox-content">
            <div class="lightbox-image-wrap">
                <img id="lightboxImg" src="" alt="">
            </div>
            <div class="lightbox-sidebar">
                <div class="sidebar-header">
                    <h3 id="photoTitle">照片标题</h3>
                    <span id="photoDate" class="photo-date">-</span>
                </div>

                <div class="comments-section">
                    <h4>💬 评论 (<span id="commentCount">0</span>)</h4>
                    <div id="commentsList" class="comments-list"></div>
                    <div class="comment-form">
                        <input type="text" id="commentName" placeholder="你的昵称" maxlength="20">
                        <textarea id="commentText" placeholder="写下你的评论..." rows="3" maxlength="200"></textarea>
                        <button id="submitComment">发表评论</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div id="toast" class="toast"></div>

    <footer class="footer">
        <p>用 ❤️ 记录每一个瞬间</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
